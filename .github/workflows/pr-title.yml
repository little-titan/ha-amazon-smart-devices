name: PR title

# Squash merges use the PR title as the commit message, and the release
# workflow reads it to pick the version bump, so it must be a conventional
# commit: feat, fix, perf, refactor, docs, test, ci, chore, build, style, revert.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  semantic-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5.5.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          requireScope: false
