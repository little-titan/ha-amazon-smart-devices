name: Release

# After Validate passes on main, pick the next version from the conventional
# commits since the last release, tag it and publish a GitHub release. The
# version is stamped into manifest.json inside the release zip only (HACS
# installs the zip), so nothing is ever pushed to main.
#
#   feat!: / BREAKING CHANGE  -> major
#   feat:                     -> minor
#   fix: / perf:              -> patch
#   anything else             -> no release
# The very first release is 0.0.1.
on:
  workflow_run:
    workflows: [Validate]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Work out the next version
        id: version
        run: |
          set -euo pipefail
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          if [ -z "$last" ]; then
            next="0.0.1"
          else
            major=${last#v}; minor=${major#*.}; patch=${minor#*.}
            major=${major%%.*}; minor=${minor%%.*}; patch=${patch%%.*}
            log=$(git log "$last..HEAD" --format='%s%n%b%n--END--')
            subjects=$(git log "$last..HEAD" --format='%s')
            if echo "$subjects" | grep -Eq '^[a-z]+(\([^)]*\))?!:' \
               || echo "$log" | grep -Eq '^BREAKING[ -]CHANGE'; then
              major=$((major + 1)); minor=0; patch=0
            elif echo "$subjects" | grep -Eq '^feat(\([^)]*\))?:'; then
              minor=$((minor + 1)); patch=0
            elif echo "$subjects" | grep -Eq '^(fix|perf)(\([^)]*\))?:'; then
              patch=$((patch + 1))
            else
              echo "No feat/fix/perf commits since $last; no release."
              echo "next=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            next="$major.$minor.$patch"
          fi
          echo "Next version: $next"
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: Build the release zip
        if: steps.version.outputs.next != ''
        run: |
          set -euo pipefail
          cd custom_components/amazon_smart_devices
          jq --arg v "${{ steps.version.outputs.next }}" '.version = $v' manifest.json > manifest.tmp
          mv manifest.tmp manifest.json
          zip -r "$GITHUB_WORKSPACE/amazon_smart_devices.zip" . -x '*__pycache__*'

      - name: Create the release
        if: steps.version.outputs.next != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.next }}" amazon_smart_devices.zip \
            --target "${{ github.event.workflow_run.head_sha }}" \
            --title "v${{ steps.version.outputs.next }}" \
            --generate-notes
